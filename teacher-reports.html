<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Reports | Virello</title><style>body{margin:0}</style></head><body><div class="va-shell"><header class="va-header"><div class="va-brand">📈 Teacher Reports<span>Performance & attendance overview</span></div><a href="teacher-dashboard.html" class="va-btn secondary">Dashboard</a></header><main class="va-container"><div class="va-title"><h1>Class Performance</h1><p>Quick view of marks and attendance for your classes.</p></div><div class="va-card"><div class="va-form"><div class="va-field"><label>Class</label><select id="class"></select></div><div class="va-field"><label>Subject</label><select id="subject"></select></div></div></div><div class="va-grid"><div class="va-stat"><small>Students</small><b id="students">0</b></div><div class="va-stat"><small>Average Mark</small><b id="avg">0%</b></div><div class="va-stat"><small>Present Records</small><b id="present">0</b></div><div class="va-stat"><small>Absent Records</small><b id="absent">0</b></div></div><div class="va-card"><div class="va-scroll"><table class="va-table"><thead><tr><th>Student</th><th>Assessments</th><th>Average</th></tr></thead><tbody id="list"></tbody></table></div></div></main></div><script type="module" src="js/teacher-reports.js"></script></body></html>
