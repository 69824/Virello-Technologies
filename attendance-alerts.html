<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Virello Technologies | Attendance Alerts
</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f5f7fb;

    color:
        #172033;

    min-height:
        100vh;

}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {

    height:
        70px;

    background:
        #ffffff;

    border-bottom:
        1px solid #e6e9ef;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 30px;

    position:
        sticky;

    top:
        0;

    z-index:
        20;

}


.brand {

    font-size:
        20px;

    font-weight:
        800;

    color:
        #172554;

}


.brand span {

    color:
        #2563eb;

}


.topbar-actions {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}


.topbar-button {

    border:
        0;

    background:
        #eef2ff;

    color:
        #3730a3;

    padding:
        10px 15px;

    border-radius:
        8px;

    font-weight:
        700;

    cursor:
        pointer;

}


.topbar-button.logout {

    background:
        #fee2e2;

    color:
        #991b1b;

}


/* =========================================================
   PAGE
========================================================= */

.page {

    max-width:
        1100px;

    margin:
        0 auto;

    padding:
        35px 20px 60px;

}


.page-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        20px;

    margin-bottom:
        25px;

}


.page-title h1 {

    font-size:
        30px;

    margin-bottom:
        7px;

}


.page-title p {

    color:
        #64748b;

}


.count-card {

    background:
        #ffffff;

    border:
        1px solid #e5e7eb;

    border-radius:
        12px;

    padding:
        15px 22px;

    text-align:
        center;

}


.count-card strong {

    display:
        block;

    font-size:
        24px;

    color:
        #2563eb;

}


.count-card span {

    font-size:
        12px;

    color:
        #64748b;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    background:
        #ffffff;

    border:
        1px solid #e5e7eb;

    border-radius:
        12px;

    padding:
        15px;

    margin-bottom:
        20px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

}


.toolbar-summary {

    color:
        #64748b;

    font-size:
        14px;

}


#markAllReadButton {

    border:
        0;

    background:
        #2563eb;

    color:
        #ffffff;

    padding:
        10px 15px;

    border-radius:
        8px;

    font-weight:
        700;

    cursor:
        pointer;

}


/* =========================================================
   ALERT CONTAINER
========================================================= */

#alertsContainer {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

}


/* =========================================================
   ALERT
========================================================= */

.attendance-alert {

    background:
        #ffffff;

    border:
        1px solid #e5e7eb;

    border-radius:
        14px;

    padding:
        20px;

    display:
        flex;

    gap:
        17px;

    transition:
        0.2s ease;

}


.attendance-alert.unread {

    border-left:
        4px solid #2563eb;

    background:
        #f8fbff;

}


.alert-icon {

    width:
        48px;

    height:
        48px;

    min-width:
        48px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        23px;

    background:
        #f1f5f9;

}


.alert-content {

    flex:
        1;

}


.alert-top {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    margin-bottom:
        5px;

}


.alert-top h3 {

    font-size:
        15px;

}


.new-badge {

    background:
        #2563eb;

    color:
        white;

    font-size:
        10px;

    font-weight:
        800;

    padding:
        3px 7px;

    border-radius:
        5px;

}


.alert-student {

    font-weight:
        700;

    margin-bottom:
        8px;

}


.alert-student span {

    color:
        #64748b;

    font-weight:
        500;

}


.alert-content p {

    color:
        #475569;

    line-height:
        1.6;

}


.alert-date {

    margin-top:
        10px;

    font-size:
        12px;

    color:
        #94a3b8;

}


.mark-read-button {

    margin-top:
        12px;

    border:
        1px solid #cbd5e1;

    background:
        white;

    color:
        #334155;

    padding:
        7px 11px;

    border-radius:
        7px;

    cursor:
        pointer;

    font-size:
        12px;

    font-weight:
        700;

}


/* =========================================================
   EMPTY
========================================================= */

.no-alerts {

    background:
        #ffffff;

    border:
        1px solid #e5e7eb;

    border-radius:
        14px;

    text-align:
        center;

    padding:
        60px 20px;

}


.no-alerts-icon {

    font-size:
        45px;

    margin-bottom:
        15px;

}


.no-alerts h3 {

    margin-bottom:
        8px;

}


.no-alerts p {

    color:
        #64748b;

    max-width:
        500px;

    margin:
        auto;

    line-height:
        1.6;

}


/* =========================================================
   LOADING
========================================================= */

#loadingScreen {

    position:
        fixed;

    inset:
        0;

    background:
        #ffffff;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    z-index:
        100;

}


.loading-box {

    text-align:
        center;

}


.loading-box h2 {

    margin-bottom:
        8px;

}


.loading-box p {

    color:
        #64748b;

}


/* =========================================================
   ERROR
========================================================= */

#errorScreen {

    position:
        fixed;

    inset:
        0;

    background:
        #ffffff;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    z-index:
        101;

}


.error-box {

    max-width:
        500px;

    text-align:
        center;

    padding:
        30px;

}


.error-box h2 {

    color:
        #991b1b;

    margin-bottom:
        10px;

}


.error-box p {

    color:
        #64748b;

}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 700px
) {

    .topbar {

        padding:
            0 15px;

    }


    .page {

        padding:
            25px 15px 40px;

    }


    .page-header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .toolbar {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .attendance-alert {

        padding:
            15px;

    }


    .brand {

        font-size:
            17px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loadingScreen">

    <div class="loading-box">

        <h2>
            Loading Attendance Alerts
        </h2>

        <p>
            Please wait...
        </p>

    </div>

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div id="errorScreen">

    <div class="error-box">

        <h2>
            Unable to Load Alerts
        </h2>

        <p id="errorMessage">
            Something went wrong.
        </p>

    </div>

</div>


<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

    <div class="brand">

        Virello
        <span>
            Technologies
        </span>

    </div>


    <div class="topbar-actions">

        <button
            type="button"
            class="topbar-button"
            id="backToDashboard"
        >
            ← Student Dashboard
        </button>


        <button
            type="button"
            class="topbar-button logout"
            id="logoutButton"
        >
            Logout
        </button>

    </div>

</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">


    <div class="page-header">

        <div class="page-title">

            <h1>
                Attendance Alerts
            </h1>

            <p>
                Attendance updates for your child.
            </p>

        </div>


        <div class="count-card">

            <strong id="unreadCount">
                0
            </strong>

            <span>
                Unread Alerts
            </span>

        </div>

    </div>


    <!-- =================================================
         TOOLBAR
    ================================================= -->

    <div class="toolbar">

        <div class="toolbar-summary">

            <strong id="alertCount">
                0
            </strong>

            attendance alert(s)

        </div>


        <button
            type="button"
            id="markAllReadButton"
        >
            Mark All as Read
        </button>

    </div>


    <!-- =================================================
         ALERTS
    ================================================= -->

    <section
        id="alertsContainer"
    >

    </section>


</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="js/parent-attendance-alerts.js"
></script>


</body>

</html>
