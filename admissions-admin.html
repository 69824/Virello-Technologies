<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admissions | Virello</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}.brand h1{font-size:20px}.brand p{font-size:12px;color:#64748b;margin-top:3px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#b91c1c}.wrap{max-width:1250px;margin:auto;padding:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.stat small{color:#64748b}.stat strong{display:block;font-size:27px;margin-top:7px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eef2f7;font-size:13px}th{background:#f8fafc;color:#475569}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:#fff7ed;color:#c2410c}.approved{background:#ecfdf5;color:#047857}.rejected{background:#fef2f2;color:#b91c1c}.review{background:#eff6ff;color:#1d4ed8}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:20;padding:20px;overflow:auto}.modal.open{display:block}.modal-card{max-width:900px;margin:30px auto;background:#fff;border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{background:#f8fafc;border-radius:10px;padding:12px}.item small{display:block;color:#64748b;margin-bottom:4px}.docs a{display:inline-block;margin:4px 7px 4px 0;color:#2563eb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head><body>
<header class="top"><div class="brand"><h1>Virello Admissions</h1><p id="schoolName">Loading...</p></div><div><button id="shareButton" class="btn secondary">Get Application Link</button> <button id="logoutButton" class="btn danger">Logout</button></div></header>
<main class="wrap">
<div class="stats"><div class="stat"><small>Total</small><strong id="totalCount">0</strong></div><div class="stat"><small>Pending</small><strong id="pendingCount">0</strong></div><div class="stat"><small>Approved</small><strong id="approvedCount">0</strong></div><div class="stat"><small>Rejected</small><strong id="rejectedCount">0</strong></div></div>
<section class="panel"><div class="toolbar"><input id="searchInput" placeholder="Search applicant name / application number"><select id="statusFilter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="review">Under Review</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refreshButton" class="btn">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>Student</th><th>Class</th><th>Parent</th><th>Telephone</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="applicationsBody"></tbody></table></div></section>
<section class="panel"><h2 style="margin-bottom:10px">Application Link</h2><p style="font-size:13px;color:#64748b">Generate a public link for parents. The link is unique to this school.</p><div id="shareLink" style="margin-top:10px;word-break:break-all;font-size:13px"></div></section>
</main>
<div id="modal" class="modal"><div class="modal-card"><div style="display:flex;justify-content:space-between;gap:15px"><h2>Admission Application</h2><button id="closeModal" class="btn secondary">Close</button></div><div id="details" style="margin-top:18px"></div><div class="actions" id="actions"></div></div></div>
<script type="module" src="./js/admissions-admin.js"></script></body></html>
