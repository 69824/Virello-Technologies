<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virello Timetable</title><style>body{margin:0}</style></head><body><div class="va-shell"><header class="va-header"><div class="va-brand">Virello Technologies<span>Timetable Management</span></div><div class="va-head-actions"><a class="va-btn secondary" href="dashboard.html">Dashboard</a><button id="logout" class="va-btn danger">Logout</button></div></header><main class="va-container"><div class="va-title"><h1>🗓️ Timetable System</h1><p>Create and manage weekly class timetables, teachers, subjects and rooms.</p></div><div class="va-card"><div class="va-form"><div class="va-field"><label>Class</label><select id="classId"></select></div><div class="va-field"><label>Academic Year</label><input id="year" value=""></div><div class="va-field"><label>Term</label><select id="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></div><div class="va-field"><label>Day</label><select id="day"></select></div><div class="va-field"><label>Start Time</label><input id="start" type="time" value="08:00"></div><div class="va-field"><label>End Time</label><input id="end" type="time" value="09:00"></div><div class="va-field"><label>Subject</label><input id="subject" placeholder="Mathematics"></div><div class="va-field"><label>Teacher</label><select id="teacherId"></select></div><div class="va-field"><label>Room</label><input id="room" placeholder="Room 8A"></div><div class="va-field"><label>Color Label</label><input id="label" placeholder="Optional"></div><div class="va-field va-wide"><label>Notes</label><input id="notes" placeholder="Optional notes"></div><div class="va-field va-wide"><div class="va-actions"><button id="save" class="va-btn">Add to Timetable</button><button id="cancel" class="va-btn secondary" style="display:none">Cancel Edit</button></div></div></div></div><div class="va-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 id="gridTitle" style="margin:0">Weekly Timetable</h2><p id="school" style="margin:5px 0;color:#64748b;font-size:12px"></p></div><button id="refresh" class="va-btn secondary">Refresh</button></div><div class="va-scroll" style="margin-top:18px"><table class="timetable"><thead><tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr></thead><tbody id="grid"></tbody></table></div></div><div class="va-card"><h2 style="margin-top:0">All Entries</h2><div class="va-scroll"><table class="va-table"><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Teacher</th><th>Room</th><th>Actions</th></tr></thead><tbody id="entries"></tbody></table></div></div></main></div><script type="module" src="js/timetable.js"></script></body></html>
